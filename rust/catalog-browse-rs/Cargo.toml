[package]
name = "catalog-browse-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of `catalog_browse.py`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
