name: Debian-family package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apt-smoke:
    name: APT package smoke (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 13
            image: debian:13
            id: debian
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            id: ubuntu
          - name: Ubuntu 26.04
            image: ubuntu:26.04
            id: ubuntu
          - name: Linux Mint 22
            image: linuxmintd/mint22-amd64@sha256:34ff53d1dca48a73486c3051425306421278225ae02b6d5066a3c940183cae1f
            id: linuxmint
    steps:
      - uses: actions/checkout@v5
      - name: Build native package
        run: |
          bash tools/build_deb.sh dist
          (cd dist && sha256sum ./*.deb > SHA256SUMS)
      - name: Install, launch and remove in a disposable container
        env:
          TEST_IMAGE: ${{ matrix.image }}
          EXPECTED_ID: ${{ matrix.id }}
        run: |
          docker run --rm -i --user 0 --entrypoint /bin/bash \
            --env EXPECTED_ID \
            --volume "$PWD/dist:/dist:ro" \
            --volume "$PWD/install.sh:/installer.sh:ro" \
            "$TEST_IMAGE" -euo pipefail -s <<'CONTAINER'
          source /etc/os-release
          printf 'Container OS: %s (%s)\n' "$PRETTY_NAME" "$ID"
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          if [[ "$EXPECTED_ID" == linuxmint ]]; then
            # This image reports the Ubuntu base. Verify Mint's package
            # repository and desktop package before testing against it.
            apt-cache show mint-info-cinnamon >/dev/null
          else
            test "$ID" = "$EXPECTED_ID"
          fi
          cd /dist
          sha256sum -c SHA256SUMS
          package=(/dist/*.deb)
          apt-get install -y --no-install-recommends curl python3 sudo desktop-file-utils
          useradd --create-home --shell /bin/bash appinstall-ci
          printf '%s\n' 'appinstall-ci ALL=(root) NOPASSWD: /usr/bin/apt-get, /usr/bin/true' > /etc/sudoers.d/appinstall-ci
          chmod 0440 /etc/sudoers.d/appinstall-ci
          printf 'ID=%s\n' "$EXPECTED_ID" > /tmp/appinstall-os-release
          python3 - "${package[0]}" <<'PYTHON'
          import json
          import subprocess
          import sys
          from pathlib import Path

          package = Path(sys.argv[1])
          version = subprocess.check_output(["dpkg-deb", "-f", package, "Version"], text=True).strip()
          tag = "v" + version.rsplit("-", 1)[0]
          arch_name = f"appinstall-{version}-any.pkg.tar.zst"
          assets = [
              {"name": path.name, "browser_download_url": path.as_uri()}
              for path in (package, Path("/dist/SHA256SUMS"))
          ]
          assets.append({"name": arch_name, "browser_download_url": f"file:///dist/{arch_name}"})
          Path("/tmp/appinstall-release.json").write_text(json.dumps({
              "tag_name": tag, "draft": False, "prerelease": False, "assets": assets,
          }))
          PYTHON
          run_installer() {
            runuser -u appinstall-ci -- env \
              APPINSTALL_TEST_OS_RELEASE=/tmp/appinstall-os-release \
              APPINSTALL_TEST_RELEASES_JSON=/tmp/appinstall-release.json \
              bash /installer.sh --yes --no-defaults "$@"
          }
          run_installer
          run_installer | grep 'already installed'
          version="$(dpkg-query -W -f='${Version}' appinstall)"
          test "$(appinstall --version)" = "appinstall ${version%-*}"
          desktop-file-validate /usr/share/applications/appinstall.desktop
          test "$(appinstall --detect example.deb)" = deb

          runuser -u appinstall-ci -- env QT_QPA_PLATFORM=offscreen python3 - <<'PY'
          import sys
          sys.path.insert(0, "/usr/lib/appinstall")
          from qt_compat import QtCore, QtWidgets
          from manager import ManagerWindow
          from diagnostics_ui import Diagnostics
          from url_dialog import UrlInstallDialog

          app = QtWidgets.QApplication([])
          windows = [ManagerWindow(), Diagnostics(), UrlInstallDialog()]
          for window in windows:
              window.show()
              assert window.isVisible()
          QtCore.QTimer.singleShot(500, app.quit)
          assert app.exec() == 0
          PY

          mkdir -p /home/appinstall-ci/Applications
          printf '%s\n' 'preserve user data' > /home/appinstall-ci/Applications/keep
          apt-get install -y --no-install-recommends --reinstall "${package[0]}"
          run_installer --uninstall
          test ! -e /usr/bin/appinstall
          test ! -e /usr/lib/appinstall/appinstall
          grep -qx 'preserve user data' /home/appinstall-ci/Applications/keep
          CONTAINER
      - uses: actions/upload-artifact@v4
        if: matrix.name == 'Debian 13'
        with:
          name: appinstall-deb-${{ github.sha }}
          path: dist/
          if-no-files-found: error
