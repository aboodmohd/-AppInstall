name: KDE KWin virtual Wayland AppInstall smoke (not full Plasma acceptance)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kwin-wayland-smoke:
    name: KDE KWin Wayland GUI/URL smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out candidate source
        uses: actions/checkout@v5

      - name: Configure Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install isolated KDE KWin virtual compositor
        timeout-minutes: 22
        run: |
          set -euo pipefail
          # Hosted Ubuntu's Azure mirror sometimes stalls.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' |
              sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' \
            /etc/apt/sources.list 2>/dev/null || true
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' \
              /etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo apt-get -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 \
            install -y --no-install-recommends \
            kwin-wayland dbus-x11 libgl1-mesa-dri libegl1 libgl1 \
            libopengl0 libdbus-1-3 libwayland-client0 \
            libxkbcommon0 libxkbcommon-x11-0
          python -m pip install PySide6
          kwin_wayland --version

      - name: Verify original AppInstall windows and URL dialogs on KDE KWin
        run: |
          dbus-run-session -- python tools/ci_kwin_wayland_smoke.py
