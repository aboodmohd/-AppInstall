name: Native Wayland Qt smoke (Weston headless; not KDE acceptance)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wayland-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out AppInstall
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install disposable Wayland compositor and Qt runtime
        timeout-minutes: 20
        run: |
          # Hosted Ubuntu runners can stall on azure.archive.ubuntu.com.
          # Keep the real headless Weston test, but use the public mirror.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' |
              sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' \
            /etc/apt/sources.list 2>/dev/null || true
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' \
              /etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo apt-get -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 \
            install -y --no-install-recommends \
            weston sway dbus-x11 libwayland-client0 libwayland-cursor0 \
            libxkbcommon0 libegl1 libgl1 libopengl0 libdbus-1-3 \
            libx11-xcb1 libxkbcommon-x11-0
          python -m pip install PySide6

      - name: Confirm AppInstall Qt windows render under native Wayland
        run: |
          dbus-run-session -- python tools/ci_wayland_smoke.py
          dbus-run-session -- python tools/ci_wayland_smoke.py --compositor sway
