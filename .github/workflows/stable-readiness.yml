name: Stable readiness compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distro-tests:
    name: ${{ matrix.distro }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Arch Linux
            image: archlinux:base-devel
            kind: arch
          - distro: Fedora 44
            image: fedora:44
            kind: fedora
    container:
      image: ${{ matrix.image }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5

      - name: Install Arch dependencies
        if: matrix.kind == 'arch'
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm python pyside6 squashfs-tools libarchive xdg-utils

      - name: Install Fedora dependencies
        if: matrix.kind == 'fedora'
        run: |
          dnf -y install python3 python3-pyside6 squashfs-tools bsdtar xdg-utils

      - name: Validate shell and run source tests
        run: |
          bash -n appinstall install-user.sh
          python3 -m unittest discover -s tests -v

      - name: Build Arch package as non-root
        if: matrix.kind == 'arch'
        run: |
          useradd --create-home --shell /bin/bash appbuild
          chown -R appbuild:appbuild "$GITHUB_WORKSPACE"
          runuser -u appbuild -- env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash -c 'cd "$GITHUB_WORKSPACE" && makepkg --noconfirm --clean'
          pkgver=$(sed -n 's/^pkgver=//p' PKGBUILD)
          pkgrel=$(sed -n 's/^pkgrel=//p' PKGBUILD)
          test -n "$pkgver" && test -n "$pkgrel"
          package="appinstall-${pkgver}-${pkgrel}-any.pkg.tar.zst"
          test -f "$package"
          echo "Package: $package"
          sha256sum "$package"
          bsdtar -tf "$package" | grep -q 'usr/bin/appinstall'
          bsdtar -tf "$package" | grep -q 'usr/share/licenses/appinstall/LICENSE'
          # Ensure pacman treats the stable build as newer than the
          # previously distributed beta and RC test packages.
          test "$(vercmp "${pkgver}-${pkgrel}" "1.0.0beta1-1")" -gt 0
          test "$(vercmp "${pkgver}-${pkgrel}" "1.0.0rc1-1")" -gt 0
          sha256sum "$package" > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Install, upgrade, and remove Arch package in disposable container
        if: matrix.kind == 'arch'
        run: |
          pkgver=$(sed -n 's/^pkgver=//p' PKGBUILD)
          pkgrel=$(sed -n 's/^pkgrel=//p' PKGBUILD)
          package="appinstall-${pkgver}-${pkgrel}-any.pkg.tar.zst"
          expected=$(sed -n 's/^VERSION="\([^"]*\)"$/\1/p' appinstall)
          test -n "$expected"
          pacman -U --noconfirm --needed "$package"
          test "$(appinstall --version)" = "appinstall $expected"
          pacman -Q appinstall
          pacman -U --noconfirm "$package"
          test "$(appinstall --version)" = "appinstall $expected"
          pacman -R --noconfirm appinstall
          ! pacman -Q appinstall

      - name: Validate clean package installation and user data preservation
        if: matrix.kind == 'arch'
        run: |
          set -eu
          pkgver=$(sed -n 's/^pkgver=//p' PKGBUILD)
          pkgrel=$(sed -n 's/^pkgrel=//p' PKGBUILD)
          expected=$(sed -n 's/^VERSION="\([^"]*\)"$/\1/p' appinstall)
          test -n "$expected"
          bash -n tools/arch_clean_install_gate.sh
          bash tools/arch_clean_install_gate.sh "appinstall-${pkgver}-${pkgrel}-any.pkg.tar.zst" "$expected"

      - name: Preserve disposable Arch package for candidate testing
        if: matrix.kind == 'arch'
        uses: actions/upload-artifact@v4
        with:
          name: appinstall-package-${{ github.sha }}
          path: |
            appinstall-*.pkg.tar.zst
            SHA256SUMS
          retention-days: 14
          if-no-files-found: error
