name: "Finalize approved AppInstall v1.5.0 release after draft verification"
on:
  push:
    branches:
      - release/v1.5.0-publication-20261115
permissions:
  contents: write
  actions: read
concurrency:
  group: "appinstall-v1.5.0-publication"
  cancel-in-progress: false
jobs:
  finalize:
    if: github.repository == 'aboodmohd/-AppInstall' && github.ref == 'refs/heads/release/v1.5.0-publication-20261115'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: aboodmohd/-AppInstall
      FINAL_SHA: 1e14b5fd589648a654db203892e81dd3810ad654
      ARCH_SHA: ea2a22f8bc7551c4f1d588194272dc7ea9c8728812f32fe47bcb6a9411fbd6b9
      DEB_SHA: aff78c6bf6628233daae6b75d9cf2fd8bca5a1d90ad887f775acb9103a7ae7ab
    steps:
      - name: "Checkout approved source, not publication branch"
        uses: actions/checkout@v4
        with:
          ref: 1e14b5fd589648a654db203892e81dd3810ad654
          persist-credentials: false

      - name: "Verify exact source and four intact DRAFT release assets"
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')" = "$FINAL_SHA"
          grep -qx 'pkgver=1.5.0' PKGBUILD
          grep -qx 'VERSION="1.5.0"' appinstall
          test "$(gh api "repos/$GH_REPO/actions/runs/43741020322" --jq '.conclusion')" = "success"
          test "$(gh api "repos/$GH_REPO/actions/runs/43741020290" --jq '.conclusion')" = "success"
          gh api "repos/$GH_REPO/releases/446244312" > draft.json
          jq -e \
            --arg source "$FINAL_SHA" \
            --arg arch "sha256:$ARCH_SHA" \
            --arg deb "sha256:$DEB_SHA" \
            '
            .id == 446244312
            and .draft == true
            and .prerelease == false
            and .tag_name == "v1.5.0"
            and .target_commitish == $source
            and (.assets | length == 4)
            and ([.assets[].name] | sort) == (["appinstall-1.5.0-1-any.pkg.tar.zst","appinstall_1.5.0-1_all.deb","SHA256SUMS","RELEASE_VERIFICATION.txt"] | sort)
            and ([.assets[] | select(.name == "appinstall-1.5.0-1-any.pkg.tar.zst") | .digest] == [$arch])
            and ([.assets[] | select(.name == "appinstall_1.5.0-1_all.deb") | .digest] == [$deb])
            and ([.assets[] | select(.name == "SHA256SUMS") | .digest] == ["sha256:4a41c8e2c0ccc41cc0b99b2faeba2e88fa12c708cd1cf7c385997395ad4dcbe2"])
            and ([.assets[] | select(.name == "RELEASE_VERIFICATION.txt") | .digest] == ["sha256:76d4a0b3f569c100554423451e9cff8cb465350ab0fcb5eb250b6e70f31de39c"])
            ' draft.json
          test "$(gh api "repos/$GH_REPO/releases/445182900" --jq .tag_name)" = "v1.4.0"
          echo 'Verified all four uploaded assets match source and package digests.'

      - name: "Publish the verified existing draft by stable release ID"
        shell: bash
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/$GH_REPO/releases/446244312" \
            -F draft=false -f make_latest=true \
            --jq '{id,tag_name,draft,published_at,target_commitish}'

      - name: "Verify PUBLIC release tag, latest pointer and download hashes"
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if gh api "repos/$GH_REPO/releases/tags/v1.5.0" > published.json 2>/dev/null; then break; fi
            sleep 2
          done
          jq -e \
            --arg sha "$FINAL_SHA" \
            --arg arch "sha256:$ARCH_SHA" \
            --arg deb "sha256:$DEB_SHA" \
            '
              .id == 446244312 and .draft == false
              and .tag_name == "v1.5.0" and .target_commitish == $sha
              and (.assets | length == 4)
              and ([.assets[] | select(.name == "appinstall-1.5.0-1-any.pkg.tar.zst") | .digest] == [$arch])
              and ([.assets[] | select(.name == "appinstall_1.5.0-1_all.deb") | .digest] == [$deb])
            ' published.json
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v1.5.0" --jq '.object.sha')" = "$FINAL_SHA"
          mkdir -p "$RUNNER_TEMP/public-download"
          gh release download v1.5.0 --dir "$RUNNER_TEMP/public-download" \
            --pattern '*.zst' --pattern '*.deb' --pattern 'SHA256SUMS' \
            --pattern 'RELEASE_VERIFICATION.txt'
          (cd "$RUNNER_TEMP/public-download" && sha256sum --check --strict SHA256SUMS)
          test "$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')" = "v1.5.0"
          echo 'PASS: v1.5.0 is public at exact source SHA with verified package assets.'
