name: KDE Dolphin MIME smoke (X11 only; not Wayland acceptance)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dolphin-mime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install disposable KDE Dolphin and Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dolphin openbox dbus-x11 xvfb xauth xdotool \
            dpkg-dev libarchive-tools shared-mime-info xdg-utils \
            libegl1 libgl1 libopengl0 libdbus-1-3 \
            libx11-xcb1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1
          python -m pip install PySide6

      - name: Verify genuine Dolphin to AppInstall MIME dispatch
        run: |
          dbus-run-session -- xvfb-run -a -s "-screen 0 1280x800x24" \
            python tools/ci_dolphin_dispatch.py
