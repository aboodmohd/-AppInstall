name: X11 graphical smoke (not KDE/Wayland acceptance)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gui-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out AppInstall
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install isolated X11 GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth xdotool libegl1 libgl1 libopengl0 libdbus-1-3 \
            libx11-xcb1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1
          python -m pip install PySide6

      - name: Verify Qt X11 platform dependencies
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          from PySide6.QtCore import QLibraryInfo
          plugin = Path(QLibraryInfo.path(QLibraryInfo.LibraryPath.PluginsPath)) / 'platforms/libqxcb.so'
          result = subprocess.run(['ldd', str(plugin)], check=True, capture_output=True, text=True)
          print(result.stdout)
          if 'not found' in result.stdout:
              raise SystemExit('Qt X11 platform plugin has missing shared-library dependencies')
          PY

      - name: Verify CLI dispatch and graphical window startup on Xvfb
        env:
          QT_DEBUG_PLUGINS: '1'
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" python tools/ci_x11_gui_smoke.py

      - name: Verify mocked DEB/RPM install GUI worker shutdown without side effects
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" python tools/ci_container_ui_lifecycle.py
